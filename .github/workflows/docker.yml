name: Docker Build and Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  docker-build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Build Backend
        run: |
          cd backend
          docker build -t nexusbank-backend:test .
          
      - name: Build Frontend
        run: |
          docker build -t nexusbank-frontend:test ./frontend
          
      - name: List Docker Images
        run: |
          docker images
          
  docker-compose-test:
    runs-on: ubuntu-latest
    needs: docker-build
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Build with Docker Compose
        run: |
          docker-compose build
          
      - name: Smoke test containers start
        run: |
           docker-compose up -d
           sleep 10
           docker-compose ps
           docker-compose down
