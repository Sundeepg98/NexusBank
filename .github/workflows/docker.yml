name: Docker Build Test

on:
  push:
    branches: [master]

jobs:
  test-docker:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Check Docker version
        run: |
          docker --version
          docker info || true
          
      - name: Build Backend
        run: |
          cd backend
          docker build .
