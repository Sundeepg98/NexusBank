name: Docker Build and Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend-build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Build Backend
        run: |
          cd backend
          docker build -t nexusbank-backend:test .
          docker images
