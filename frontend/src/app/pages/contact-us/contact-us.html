<section class="page">
  <h1>Contact Us</h1>
  
  <div class="contact-grid">
    <div class="contact-form">
      <h2>Send us a message</h2>
      <form>
        <div class="form-group">
          <label>Name</label>
          <input type="text" placeholder="Your name">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" placeholder="Your email">
        </div>
        <div class="form-group">
          <label>Message</label>
          <textarea rows="5" placeholder="Your message"></textarea>
        </div>
        <button type="submit" class="btn">Send Message</button>
      </form>
    </div>
    
    <div class="contact-info">
      <h2>Get in touch</h2>
      <div class="info-item">
        <strong>Email:</strong> support@nexusbank.com
      </div>
      <div class="info-item">
        <strong>Phone:</strong> 1-800-NEXUSBK
      </div>
      <div class="info-item">
        <strong>Address:</strong> 123 Banking Street, Financial District
      </div>
    </div>
  </div>
</section>
